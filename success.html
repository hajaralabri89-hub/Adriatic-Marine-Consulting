<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent — Adriatic Marine Consulting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink:  #0e1a26;
      --gold: #9c7a3c;
      --sand: #f4f1eb;
      --muted: #5f6b78;
    }
    html, body { height: 100%; }
    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: var(--sand);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .rule {
      width: 32px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 2rem;
    }
    h1 {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.85;
      font-weight: 300;
      max-width: 420px;
      margin: 0 auto 2.5rem;
    }
    a {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      padding: 11px 26px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      font-family: 'IBM Plex Sans', sans-serif;
      transition: background 0.2s;
    }
    a:hover { background: #1a2d40; }
    .brand {
      margin-top: 3rem;
      font-family: 'Libre Baskerville', serif;
      font-size: 12px;
      color: rgba(156, 122, 60, 0.65);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="rule"></div>
  <h1>Message received.</h1>
  <p>Thank you for getting in touch. We will review your enquiry and respond directly to your email address.</p>
  <a href="/">Return to website</a>
  <div class="brand">Adriatic Marine Consulting</div>
</body>
</html>
